name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  link-check:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check all README links resolve
        run: python tests/check_links.py

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint README.md
        run: |
          npx --yes markdownlint-cli@0.41.0 README.md CONTRIBUTING.md